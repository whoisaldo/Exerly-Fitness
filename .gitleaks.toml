title = "Exerly gitleaks config"

# Start from gitleaks' built-in ruleset, then add project-specific allowlisting.
[extend]
useDefault = true

[allowlist]
description = "Known-safe sample/placeholder values that are not real secrets"
paths = [
  '''.*\.env\.example$''',
  '''README\.md''',
]
regexes = [
  # Unsigned account-a/account-b tokens used by native StubURLProtocol tests.
  '''^e30\.eyJzdWIiOiJ[hi]In0\.fixture$''',
  '''your-jwt-secret-here''',
  '''your-gemini-api-key''',
  '''your-fatsecret-client-id''',
  '''your-fatsecret-client-secret''',
  '''mongodb\+srv://user:password@cluster''',
]
